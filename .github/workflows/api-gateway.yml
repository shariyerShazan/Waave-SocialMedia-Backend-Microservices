name: API Gateway CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/api-gateway.yml"
      - ".github/workflows/_reusable-service-cicd.yml"
      - "apps/api-gateway/**"
      - "libs/common/**"
      - "libs/kafka/**"
      - "libs/proto-schema/**"
      - "libs/grpc-clients/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/api-gateway.yml"
      - "apps/api-gateway/**"
      - "libs/common/**"
      - "libs/kafka/**"
      - "libs/proto-schema/**"
      - "libs/grpc-clients/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
  workflow_dispatch: {}

