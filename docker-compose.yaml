  feed_redis:
    image: redis:7-alpine
    container_name: waave_redis_feed
    ports:
      - '6373:6379'
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - feed_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - waave

  # ── feed Redis
  chat_redis:
    image: redis:7-alpine
    container_name: waave_redis_chat
    ports:
      - '6372:6379'
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - chat_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - waave

  # ── e2ee chat Redis
  e2ee_chat_redis:
    image: redis:7-alpine
    container_name: waave_redis_e2ee_chat
    ports:
      - '6371:6379'
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - e2ee_chat_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - waave

  # ── Kafka ──────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: waave_kafka
    ports:
      - '9092:9092'
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          'kafka-topics --bootstrap-server localhost:9092 --list',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    networks:
      - waave

  # ── Kafka UI ───────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: waave_kafka_ui
    ports:
      - '8080:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - waave

  # ── Services ───────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    command: >
      sh -c "
        npx prisma migrate deploy --config apps/auth-service/prisma/prisma.config.ts &&
        node dist/apps/auth-service/main.js
      "
    image: ${DOCKER_USERNAME}/auth-service
    container_name: waave_auth_service
    ports:
      - '${AUTH_HTTP_PORT:-4001}:4001'
      - '${AUTH_GRPC_PORT:-3001}:3001'
    # Common
    environment:
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
      MEDIA_HTTP_BASE_URL: http://media-service:4009
      DOCKER_USERNAME: waave
      KAFKA_BROKERS: kafka:9092
      AUTH_SERVICE_GRPC_URL: auth-service:3001
      USER_SERVICE_GRPC_URL: user-service:3002
      POST_SERVICE_GRPC_URL: post-service:3003
      FEED_SERVICE_GRPC_URL: feed-service:3004
      CHAT_SERVICE_GRPC_URL: chat-service:3005
      E2EE_CHAT_SERVICE_GRPC_URL: e2ee-chat-service:3006
      MEDIA_SERVICE_GRPC_URL: media-service:3009
      NOTIFICATION_GRPC_URL: notification-service:3010
      MCP_SERVICE_GRPC_URL: mcp-service:3011
      AUTH_DB_PRIMARY_URL: postgresql://postgres:postgres123@auth-postgres-primary:5432/auth_db?schema=public
      AUTH_DB_REPLICA_URL: postgresql://postgres:postgres123@auth-postgres-replica:5432/auth_db?schema=public
      AUTH_GRPC_PORT: 3001
      AUTH_HTTP_PORT: 4001
      JWT_ACCESS_SECRET: access_super_secret_key_2024
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_SECRET: refresh_super_secret_key_2024
      JWT_REFRESH_EXPIRES: 7d
      MAX_LOGIN_ATTEMPTS: 5
      PASSWORD_HASH_SOLT: 12
      AUTH_REDIS_HOST: auth_redis
      AUTH_REDIS_PORT: 6379
    depends_on:
      auth-postgres-primary:
        condition: service_healthy
      auth-postgres-replica:
        condition: service_healthy
      auth_redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:4001/docs > /dev/null || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks:
      - waave



volumes:
  auth_postgres_primary_data:
  auth_postgres_replica_data:

  user_postgres_primary_data:
  user_postgres_replica_data:

  post_postgres_primary_data:
  post_postgres_replica_data:

  e2ee_chat_postgres_primary_data:
  e2ee_chat_postgres_replica_data:

  media_mongo_db_1_data:
  media_mongo_db_2_data:
  media_mongo_db_3_data:

  notification_mongo_db_1_data:
  notification_mongo_db_2_data:
  notification_mongo_db_3_data:

  chat_mongo_db_1_data:
  chat_mongo_db_2_data:
  chat_mongo_db_3_data:

  auth_redis_data:
  user_redis_data:
  media_redis_data:
  api_gateway_redis_data:
  notification_redis_data:
  post_redis_data:
  feed_redis_data:
  chat_redis_data:
  e2ee_chat_redis_data:

  kafka_data:

networks:
  waave:
    driver: bridge
