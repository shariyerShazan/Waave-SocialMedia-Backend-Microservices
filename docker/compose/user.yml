services:
  user-service:
    build:
      context: ../../
      dockerfile: apps/user-service/Dockerfile
    image: ${DOCKER_USERNAME}/user-service
    container_name: waave_user_service
    command: >
      sh -c "
        npx prisma migrate deploy --config apps/user-service/prisma/prisma.config.ts &&
        node dist/apps/user-service/main.js
      "
    env_file:
      - ../../.env
    ports:
      - '${USER_HTTP_PORT:-4002}:4002'
      - '${USER_GRPC_PORT:-3002}:3002'
    environment:
      - USER_DB_PRIMARY_URL=postgresql://postgres:postgres123@user-postgres-primary:5432/user_db?schema=public
      - USER_DB_REPLICA_URL=postgresql://postgres:postgres123@user-postgres-replica:5432/user_db?schema=public
      - USER_REDIS_HOST=user_redis
      - KAFKA_BROKERS=kafka:9092
      # gRPC peer services
      - AUTH_SERVICE_GRPC_URL=auth-service:3001
      - USER_SERVICE_GRPC_URL=user-service:3002
      - POST_SERVICE_GRPC_URL=post-service:3003
      - FEED_SERVICE_GRPC_URL=feed-service:3004
      - CHAT_SERVICE_GRPC_URL=chat-service:3005
      - E2EE_CHAT_SERVICE_GRPC_URL=e2ee-chat-service:3006
      - MEDIA_SERVICE_GRPC_URL=media-service:3009
      - NOTIFICATION_GRPC_URL=notification-service:3010
      - MCP_SERVICE_GRPC_URL=mcp-service:3011
    restart: unless-stopped
    networks:
      - waave

networks:
  waave:
    name: waave
    external: true
