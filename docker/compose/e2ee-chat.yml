services:
  e2ee-chat-service:
    build:
      context: ../../
      dockerfile: apps/e2ee-chat-service/Dockerfile
    image: ${DOCKER_USERNAME}/e2ee-chat-service
    container_name: waave_e2ee_chat_service
    command: >
      sh -c "
        npx prisma migrate deploy --config apps/e2ee-chat-service/prisma/prisma.config.ts &&
        node dist/apps/e2ee-chat-service/main.js
      "
    env_file:
      - ../../.env
    ports:
      - '${E2EE_CHAT_HTTP_PORT:-4006}:4006'
      - '${E2EE_CHAT_GRPC_PORT:-3006}:3006'
    environment:
      - E2EE_CHAT_DB_PRIMARY_URL=postgresql://postgres:postgres123@e2ee-chat-postgres-primary:5432/e2ee_chat_db?schema=public
      - E2EE_CHAT_DB_REPLICA_URL=postgresql://postgres:postgres123@e2ee-chat-postgres-replica:5432/e2ee_chat_db?schema=public
      - E2EE_CHAT_REDIS_HOST=e2ee_chat_redis
      - KAFKA_BROKERS=kafka:9092
      # gRPC peer services
      - AUTH_SERVICE_GRPC_URL=auth-service:3001
      - USER_SERVICE_GRPC_URL=user-service:3002
      - POST_SERVICE_GRPC_URL=post-service:3003
      - FEED_SERVICE_GRPC_URL=feed-service:3004
      - CHAT_SERVICE_GRPC_URL=chat-service:3005
      - E2EE_CHAT_SERVICE_GRPC_URL=e2ee-chat-service:3006
      - MEDIA_SERVICE_GRPC_URL=media-service:3009
      - NOTIFICATION_GRPC_URL=notification-service:3010
      - MCP_SERVICE_GRPC_URL=mcp-service:3011
    restart: unless-stopped
    networks:
      - waave

networks:
  waave:
    name: waave
    external: true
