  # ── Redis ──────────────────────────────────────
  # ── Auth Redis
  auth_redis:
    image: redis:7-alpine
    container_name: waave_redis_auth
    ports:
      - '6379:6379'
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy volatile-ttl
      --appendonly yes
    volumes:
      - auth_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - waave

