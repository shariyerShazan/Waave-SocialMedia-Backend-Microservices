name: E2EE Chat Service CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/e2ee-chat-service.yml"
      - ".github/workflows/_reusable-service-cicd.yml"
      - "apps/e2ee-chat-service/**"
      - "libs/common/**"
      - "libs/kafka/**"
      - "libs/proto-schema/**"
      - "libs/grpc-clients/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/e2ee-chat-service.yml"
      - "apps/e2ee-chat-service/**"
      - "libs/common/**"
      - "libs/kafka/**"
      - "libs/proto-schema/**"
      - "libs/grpc-clients/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
  workflow_dispatch: {}

