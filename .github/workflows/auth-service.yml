name: Auth Service CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/workflows/auth-service.yml'
      - 'apps/auth-service/**'
      - 'libs/common/**'
      - 'libs/kafka/**'
      - 'libs/proto-schema/**'
      - 'libs/grpc-clients/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'

  pull_request:
    branches:
      - main
      - develop
    paths:
      - '.github/workflows/auth-service.yml'
      - 'apps/auth-service/**'
      - 'libs/common/**'
      - 'libs/kafka/**'
      - 'libs/proto-schema/**'
      - 'libs/grpc-clients/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'

  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Generate Auth Prisma Client
        run: npm run auth:prisma:generate

      - name: Build Auth Service
        run: npx nest build auth-service

  docker-build-push:
    name: Build & Push Docker Image
    needs: build-and-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/auth-service
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/auth-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: docker-build-push
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            # Go to Docker Compose directory
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH }}"
            cd "${DEPLOY_PATH:-$HOME/waave}"

            echo "Starting infrastructure..."
            docker compose -f docker/compose/infrastructure.yml --env-file .env up -d

            echo "Waiting for infrastructure..."
            sleep 10

            echo "Pulling auth-service..."
            docker compose -f docker/compose/auth.yml --env-file .env pull auth-service

            echo "Starting auth-service..."
            docker compose -f docker/compose/auth.yml --env-file .env up -d auth-service

            echo "Auth-service status..."
            docker compose -f docker/compose/auth.yml --env-file .env ps auth-service

            echo "🧹 Cleaning unused images..."
            docker image prune -f
