
syntax = "proto3";

package user;

service UserService {
  // Profile
  rpc GetProfile      (GetProfileRequest)    returns (ProfileResponse);
  rpc UpdateProfile   (UpdateProfileRequest) returns (ProfileResponse);
  rpc DeleteAccount   (DeleteAccountRequest) returns (DeleteResponse);

  // Follow System
  rpc FollowUser      (FollowRequest)        returns (FollowResponse);
  rpc UnfollowUser    (FollowRequest)        returns (FollowResponse);
  rpc GetFollowers    (PaginationRequest)    returns (UsersListResponse);
  rpc GetFollowing    (PaginationRequest)    returns (UsersListResponse);
  rpc IsFollowing     (FollowRequest)        returns (IsFollowingResponse);

  // Search & Suggest
  rpc SearchUsers     (SearchRequest)        returns (UsersListResponse);
  rpc GetSuggestions  (SuggestionRequest)    returns (UsersListResponse);

  // Presence
  rpc SetOnline       (PresenceRequest)      returns (PresenceResponse);
  rpc SetOffline      (PresenceRequest)      returns (PresenceResponse);
  rpc GetOnlineStatus (PresenceRequest)      returns (PresenceResponse);

  // Internal — other services call
  rpc GetUsersByIds   (GetUsersByIdsRequest) returns (UsersListResponse);
  rpc GetFollowerIds  (GetFollowerIdsRequest)returns (FollowerIdsResponse);



  // ── E2EE Device & Key Management ────────────────
  rpc RegisterDevice          (RegisterDeviceRequest)          returns (DeviceResponse);
  rpc ListDevices             (ListDevicesRequest)             returns (ListDevicesResponse);
  rpc RevokeDevice            (RevokeDeviceRequest)            returns (OperationResponse);
  rpc UploadKeys              (UploadKeysRequest)              returns (OperationResponse);
  rpc RotateSignedPreKey      (RotateSignedPreKeyRequest)      returns (OperationResponse);
  rpc RefillOneTimePreKeys    (RefillOneTimePreKeysRequest)    returns (OperationResponse);
  rpc GetKeyBundle            (GetKeyBundleRequest)            returns (KeyBundleResponse);
  rpc GetKeyBundlesForUsers   (GetKeyBundlesForUsersRequest)   returns (KeyBundlesResponse);
  rpc CountOneTimePreKeys     (CountOneTimePreKeysRequest)     returns (CountOneTimePreKeysResponse);
}

// ── Profile Messages ──────────────────────────────
message GetProfileRequest {
  string userId      = 1;
  string requesterId = 2;
}

message UpdateProfileRequest {
  string userId         = 1;
  optional string name  = 2;
  optional string bio   = 3;
  optional string avatarMediaId = 4;
  optional string coverMediaId  = 5;
  optional string location = 6;
  optional string website  = 7;
  optional string birthDate = 8;
}

message DeleteAccountRequest {
  string userId = 1;
}

message DeleteResponse {
  bool   success = 1;
  string message = 2;
}

// ── Follow Messages ───────────────────────────────
message FollowRequest {
  string followerId = 1;
  string targetId   = 2;
}

message FollowResponse {
  bool   success         = 1;
  string message         = 2;
  int32  followersCount  = 3;
  bool   isFollowing     = 4;
}

message IsFollowingResponse {
  bool isFollowing = 1;
}

message PaginationRequest {
  string userId = 1;
  int32  page   = 2;
  int32  limit  = 3;
}

// ── Search Messages ───────────────────────────────
message SearchRequest {
  string query       = 1;
  string requesterId = 2;
  int32  page        = 3;
  int32  limit       = 4;
}

message SuggestionRequest {
  string userId = 1;
  int32  limit  = 2;
}

// ── Presence Messages ─────────────────────────────
message PresenceRequest {
  string userId = 1;
}

message PresenceResponse {
  bool   isOnline  = 1;
  int64  lastSeen  = 2;
}

message UserMedia {
  string id       = 1;
  string url      = 2;
  string mimeType = 3;
  string type     = 4;
}

message UserProfile {
  string id             = 1;
  string name           = 2;
  string email          = 3;
  string bio            = 4;
  UserMedia avatar      = 5;
  UserMedia coverImg    = 6;
  string location       = 7;
  string website        = 8;
  string birthDate      = 9;
  int32  followersCount = 10;
  int32  followingCount = 11;
  int32  postsCount     = 12;
  bool   isFollowing    = 13;
  bool   isOnline       = 14;
  string createdAt      = 15;
}

message ProfileResponse {
  bool        success = 1;
  string      message = 2;
  UserProfile user    = 3;
}

message UsersListResponse {
  bool              success = 1;
  repeated UserProfile users= 2;
  int32             total   = 3;
  int32             page    = 4;
}

message GetUsersByIdsRequest {
  repeated string userIds = 1;
}

message GetFollowerIdsRequest {
  string userId = 1;
}

message FollowerIdsResponse {
  repeated string followerIds = 1;
}


message OperationResponse {
  bool   success = 1;
  string message = 2;
}

// ── E2EE Devices & Keys ───────────────────────────
message RegisterDeviceRequest {
  string userId     = 1;
  string deviceId   = 2;
  string deviceName = 3;
  string platform   = 4;
  optional string osVersion  = 5;
  optional string appVersion = 6;
}

message DeviceInfo {
  string id         = 1;
  string deviceId   = 2;
  string deviceName = 3;
  string platform   = 4;
  string osVersion  = 5;
  string appVersion = 6;
  bool   isActive   = 7;
  int64  lastSeenAt = 8;
  string createdAt  = 9;
}

message DeviceResponse {
  bool       success = 1;
  string     message = 2;
  DeviceInfo device  = 3;
}

message ListDevicesRequest {
  string userId = 1;
}

message ListDevicesResponse {
  bool success = 1;
  repeated DeviceInfo devices = 2;
}

message RevokeDeviceRequest {
  string userId   = 1;
  string deviceId = 2;
}

message IdentityKeyData {
  string publicKey      = 1;
  int32  registrationId = 2;
}

message SignedPreKeyData {
  int32  keyId     = 1;
  string publicKey = 2;
  string signature = 3;
}

message OneTimePreKeyData {
  int32  keyId     = 1;
  string publicKey = 2;
}

message UploadKeysRequest {
  string userId   = 1;
  string deviceId = 2;
  IdentityKeyData identityKey = 3;
  SignedPreKeyData signedPreKey = 4;
  repeated OneTimePreKeyData oneTimePreKeys = 5;
}

message RotateSignedPreKeyRequest {
  string userId   = 1;
  string deviceId = 2;
  SignedPreKeyData signedPreKey = 3;
}

message RefillOneTimePreKeysRequest {
  string userId   = 1;
  string deviceId = 2;
  repeated OneTimePreKeyData oneTimePreKeys = 3;
}

message GetKeyBundleRequest {
  string targetUserId = 1;
  optional string deviceId = 2;
  string requesterId = 3;
}

message DeviceKeyBundle {
  string deviceId = 1;
  string platform = 2;
  string deviceName = 3;
  IdentityKeyData identityKey = 4;
  SignedPreKeyData signedPreKey = 5;
  optional OneTimePreKeyData oneTimePreKey = 6;
  int32 registrationId = 7;
}

message KeyBundleResponse {
  bool success = 1;
  string message = 2;
  string userId = 3;
  repeated DeviceKeyBundle devices = 4;
}

message GetKeyBundlesForUsersRequest {
  repeated string userIds = 1;
  string requesterId = 2;
}

message UserKeyBundles {
  string userId = 1;
  repeated DeviceKeyBundle devices = 2;
}

message KeyBundlesResponse {
  bool success = 1;
  repeated UserKeyBundles bundles = 2;
}

message CountOneTimePreKeysRequest {
  string userId   = 1;
  string deviceId = 2;
}

message CountOneTimePreKeysResponse {
  bool  success = 1;
  int32 count   = 2;
}
